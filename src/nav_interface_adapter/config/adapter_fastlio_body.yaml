nav_interface_adapter:
  ros__parameters:
    input_odom_topic: /Odometry
    output_odom_topic: /odom
    input_cloud_topic: /cloud_registered_body
    output_cloud_topic: /sensors/cloud
    output_scan_topic: /scan

    cloud_input_type: pointcloud2
    output_cloud_frame: base_link

    odom_frame: odom
    base_frame: base_link
    cloud_frame: fastlio_body
    scan_target_frame: base_link
    publish_tf: true
    publish_lidar_tf: true
    base_to_lidar_xyz: [0.0, 0.0, 0.0]
    base_to_lidar_rpy: [0.0, 0.0, 0.0]

    min_height: 0.1
    max_height: 0.8
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.3
    range_max: 40.0
    use_inf: true
    inf_epsilon: 1.0
    transform_tolerance: 0.05
